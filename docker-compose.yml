version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: urban_heat_postgis
    restart: always
    environment:
      POSTGRES_DB: urban_heat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_heat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
